  <rect width="1200" height="1200" fill="url(#bsvcwebdevelopment)"/>
  <rect width="1200" height="1200" fill="url(#g1svcwebdevelopment)"/>
  <rect width="1200" height="1200" fill="url(#g2svcwebdevelopment)"/>

  <g filter="url(#blsvcwebdevelopment)" opacity="0.85">
    <rect x="-240" y="264" width="1680" height="108" fill="url(#lsvcwebdevelopment)" transform="rotate(0 600 600)"/>
    <rect x="-240" y="792" width="1680" height="60" fill="url(#lsvcwebdevelopment)" transform="rotate(0 600 600)"/>
  </g>

  

  <rect width="1200" height="1200" filter="url(#grsvcwebdevelopment)" opacity="0.05" style="mix-blend-mode:overlay"/>
