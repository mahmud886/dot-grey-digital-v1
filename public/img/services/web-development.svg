    </radialGradient>
    <radialGradient id="g2svcwebdevelopment" cx="77%" cy="68%" r="48%">
      <stop offset="0%" stop-color="hsl(300 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(300 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lsvcwebdevelopment" x1="0" y1="0" x2="1" y2="0">
