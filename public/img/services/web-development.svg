      <stop offset="0%" stop-color="hsl(0 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(20 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(45 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1svcwebdevelopment" cx="25%" cy="31%" r="58%">
      <stop offset="0%" stop-color="#ff5a3c" stop-opacity="0.34"/>
