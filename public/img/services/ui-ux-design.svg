    </radialGradient>
    <radialGradient id="g2svcuiuxdesign" cx="60%" cy="86%" r="48%">
      <stop offset="0%" stop-color="hsl(277 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(277 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lsvcuiuxdesign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
