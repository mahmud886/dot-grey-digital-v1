      <stop offset="0%" stop-color="hsl(337 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(357 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(22 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1svcuiuxdesign" cx="22%" cy="15%" r="58%">
      <stop offset="0%" stop-color="#ff5a3c" stop-opacity="0.34"/>
