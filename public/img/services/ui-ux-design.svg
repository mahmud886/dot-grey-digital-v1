  <rect width="1200" height="1200" fill="url(#bsvcuiuxdesign)"/>
  <rect width="1200" height="1200" fill="url(#g1svcuiuxdesign)"/>
  <rect width="1200" height="1200" fill="url(#g2svcuiuxdesign)"/>

  <g filter="url(#blsvcuiuxdesign)" opacity="0.85">
    <rect x="-240" y="264" width="1680" height="108" fill="url(#lsvcuiuxdesign)" transform="rotate(-23 600 600)"/>
    <rect x="-240" y="792" width="1680" height="60" fill="url(#lsvcuiuxdesign)" transform="rotate(-23 600 600)"/>
  </g>

  

  <rect width="1200" height="1200" filter="url(#grsvcuiuxdesign)" opacity="0.05" style="mix-blend-mode:overlay"/>
