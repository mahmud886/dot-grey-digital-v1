  <rect width="1200" height="1200" fill="url(#bsvcbannerads)"/>
  <rect width="1200" height="1200" fill="url(#g1svcbannerads)"/>
  <rect width="1200" height="1200" fill="url(#g2svcbannerads)"/>

  <g filter="url(#blsvcbannerads)" opacity="0.85">
    <rect x="-240" y="264" width="1680" height="108" fill="url(#lsvcbannerads)" transform="rotate(-19 600 600)"/>
