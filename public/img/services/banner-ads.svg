    </radialGradient>
    <radialGradient id="g2svcbannerads" cx="53%" cy="65%" r="48%">
      <stop offset="0%" stop-color="hsl(281 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(281 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lsvcbannerads" x1="0" y1="0" x2="1" y2="0">
