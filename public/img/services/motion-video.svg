<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="svc-motion-video">
  <defs>
    <linearGradient id="bsvcmotionvideo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(330 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(350 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(15 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1svcmotionvideo" cx="35%" cy="-5%" r="58%">
      <stop offset="0%" stop-color="#ff5a3c" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2svcmotionvideo" cx="41%" cy="33%" r="48%">
      <stop offset="0%" stop-color="hsl(270 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(270 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lsvcmotionvideo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blsvcmotionvideo"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="grsvcmotionvideo"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bsvcmotionvideo)"/>
  <rect width="1200" height="1200" fill="url(#g1svcmotionvideo)"/>
  <rect width="1200" height="1200" fill="url(#g2svcmotionvideo)"/>

  <g filter="url(#blsvcmotionvideo)" opacity="0.85">
    <rect x="-240" y="264" width="1680" height="108" fill="url(#lsvcmotionvideo)" transform="rotate(-30 600 600)"/>
    <rect x="-240" y="792" width="1680" height="60" fill="url(#lsvcmotionvideo)" transform="rotate(-30 600 600)"/>
  </g>

  

  <rect width="1200" height="1200" filter="url(#grsvcmotionvideo)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <rect width="1200" height="1200" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>