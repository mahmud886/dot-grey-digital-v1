<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Email still runs on tables">
  <defs>
    <linearGradient id="bpostemailstillrunsontables" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(12 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(32 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(57 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1postemailstillrunsontables" cx="37%" cy="10%" r="58%">
      <stop offset="0%" stop-color="hsl(22 70% 55%)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="hsl(22 70% 55%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2postemailstillrunsontables" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="hsl(312 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(312 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lpostemailstillrunsontables" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blpostemailstillrunsontables"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="grpostemailstillrunsontables"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bpostemailstillrunsontables)"/>
  <rect width="1600" height="900" fill="url(#g1postemailstillrunsontables)"/>
  <rect width="1600" height="900" fill="url(#g2postemailstillrunsontables)"/>

  <g filter="url(#blpostemailstillrunsontables)" opacity="0.85">
    <rect x="-320" y="198" width="2240" height="81" fill="url(#lpostemailstillrunsontables)" transform="rotate(12 800 450)"/>
    <rect x="-320" y="594" width="2240" height="45" fill="url(#lpostemailstillrunsontables)" transform="rotate(12 800 450)"/>
  </g>

  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Kanit, system-ui, sans-serif" font-weight="700" font-size="288" fill="#ffffff" fill-opacity="0.08" letter-spacing="-0.03em">ET</text>

  <rect width="1600" height="900" filter="url(#grpostemailstillrunsontables)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <rect width="1600" height="900" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>