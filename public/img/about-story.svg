<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400" role="img" aria-label="Studio">
  <defs>
    <linearGradient id="bdgstory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(0 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(20 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(45 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1dgstory" cx="45%" cy="-24%" r="58%">
      <stop offset="0%" stop-color="hsl(10 70% 55%)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="hsl(10 70% 55%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2dgstory" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="hsl(300 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(300 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ldgstory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bldgstory"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="grdgstory"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1200" height="1400" fill="url(#bdgstory)"/>
  <rect width="1200" height="1400" fill="url(#g1dgstory)"/>
  <rect width="1200" height="1400" fill="url(#g2dgstory)"/>

  <g filter="url(#bldgstory)" opacity="0.85">
    <rect x="-240" y="308" width="1680" height="126" fill="url(#ldgstory)" transform="rotate(0 600 700)"/>
    <rect x="-240" y="924" width="1680" height="70" fill="url(#ldgstory)" transform="rotate(0 600 700)"/>
  </g>

  

  <rect width="1200" height="1400" filter="url(#grdgstory)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <rect width="1200" height="1400" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>