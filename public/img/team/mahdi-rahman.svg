<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Mahdi Rahman">
  <defs>
    <linearGradient id="pmahdirahman" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="hsl(350 14% 17%)"/>
      <stop offset="100%" stop-color="hsl(20 16% 8%)"/>
    </linearGradient>
    <radialGradient id="pgmahdirahman" cx="50%" cy="32%" r="46%">
      <stop offset="0%" stop-color="#ff5a3c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="pnmahdirahman"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#pmahdirahman)"/>
  <rect width="800" height="1000" fill="url(#pgmahdirahman)"/>

  <!-- Neutral silhouette: shoulders and head, no facial features. -->
  <g fill="#ffffff" fill-opacity="0.09">
    <circle cx="400" cy="360" r="124"/>
    <path d="M 128 1000 C 128 660, 272 580, 400 580 C 528 580, 672 660, 672 1000 Z"/>
  </g>

  <text x="50%" y="360" text-anchor="middle" dominant-baseline="central" font-family="Kanit, system-ui, sans-serif" font-weight="700" font-size="104" fill="#ffffff" fill-opacity="0.5">MR</text>

  <rect width="800" height="1000" filter="url(#pnmahdirahman)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>