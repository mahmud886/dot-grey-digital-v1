  <rect width="1600" height="1100" fill="url(#g2dgculture)"/>

  <g filter="url(#bldgculture)" opacity="0.85">
    <rect x="-320" y="242" width="2240" height="99" fill="url(#ldgculture)" transform="rotate(-7 800 550)"/>
    <rect x="-320" y="726" width="2240" height="55" fill="url(#ldgculture)" transform="rotate(-7 800 550)"/>
  </g>

  

  <rect width="1600" height="1100" filter="url(#grdgculture)" opacity="0.05" style="mix-blend-mode:overlay"/>
