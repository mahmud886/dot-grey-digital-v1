<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-label="Studio">
  <defs>
    <linearGradient id="bdgculture" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(353 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(13 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(38 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1dgculture" cx="38%" cy="-10%" r="58%">
