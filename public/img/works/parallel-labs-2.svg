<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Parallel Labs — image 2">
  <defs>
    <linearGradient id="bparallellabs2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(12 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(32 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(57 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1parallellabs2" cx="37%" cy="0%" r="58%">
      <stop offset="0%" stop-color="hsl(22 70% 55%)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="hsl(22 70% 55%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2parallellabs2" cx="25%" cy="31%" r="48%">
      <stop offset="0%" stop-color="hsl(312 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(312 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lparallellabs2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blparallellabs2"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="grparallellabs2"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bparallellabs2)"/>
  <rect width="1600" height="1000" fill="url(#g1parallellabs2)"/>
  <rect width="1600" height="1000" fill="url(#g2parallellabs2)"/>

  <g filter="url(#blparallellabs2)" opacity="0.85">
    <rect x="-320" y="220" width="2240" height="90" fill="url(#lparallellabs2)" transform="rotate(12 800 500)"/>
    <rect x="-320" y="660" width="2240" height="50" fill="url(#lparallellabs2)" transform="rotate(12 800 500)"/>
  </g>

  

  <rect width="1600" height="1000" filter="url(#grparallellabs2)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <rect width="1600" height="1000" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>