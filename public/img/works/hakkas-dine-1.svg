<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Hakka's Dine — image 1">
  <defs>
    <linearGradient id="bhakkasdine1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(341 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(1 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(26 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1hakkasdine1" cx="46%" cy="-9%" r="58%">
      <stop offset="0%" stop-color="hsl(351 70% 55%)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="hsl(351 70% 55%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2hakkasdine1" cx="15%" cy="25%" r="48%">
      <stop offset="0%" stop-color="hsl(281 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(281 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lhakkasdine1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blhakkasdine1"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="grhakkasdine1"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bhakkasdine1)"/>
  <rect width="1600" height="1000" fill="url(#g1hakkasdine1)"/>
  <rect width="1600" height="1000" fill="url(#g2hakkasdine1)"/>

  <g filter="url(#blhakkasdine1)" opacity="0.85">
    <rect x="-320" y="220" width="2240" height="90" fill="url(#lhakkasdine1)" transform="rotate(-19 800 500)"/>
    <rect x="-320" y="660" width="2240" height="50" fill="url(#lhakkasdine1)" transform="rotate(-19 800 500)"/>
  </g>

  

  <rect width="1600" height="1000" filter="url(#grhakkasdine1)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <rect width="1600" height="1000" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>