<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Hakka's Dine">
  <defs>
    <linearGradient id="bhakkasdine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(349 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(9 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(34 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1hakkasdine" cx="34%" cy="5%" r="58%">
      <stop offset="0%" stop-color="hsl(359 70% 55%)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="hsl(359 70% 55%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2hakkasdine" cx="36%" cy="53%" r="48%">
      <stop offset="0%" stop-color="hsl(289 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(289 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lhakkasdine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blhakkasdine"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="grhakkasdine"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bhakkasdine)"/>
  <rect width="1600" height="1000" fill="url(#g1hakkasdine)"/>
  <rect width="1600" height="1000" fill="url(#g2hakkasdine)"/>

  <g filter="url(#blhakkasdine)" opacity="0.85">
    <rect x="-320" y="220" width="2240" height="90" fill="url(#lhakkasdine)" transform="rotate(-11 800 500)"/>
    <rect x="-320" y="660" width="2240" height="50" fill="url(#lhakkasdine)" transform="rotate(-11 800 500)"/>
  </g>

  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Kanit, system-ui, sans-serif" font-weight="700" font-size="320" fill="#ffffff" fill-opacity="0.08" letter-spacing="-0.03em">HD</text>

  <rect width="1600" height="1000" filter="url(#grhakkasdine)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <rect width="1600" height="1000" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>