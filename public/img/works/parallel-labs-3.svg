    </radialGradient>
    <radialGradient id="g2parallellabs3" cx="25%" cy="31%" r="48%">
      <stop offset="0%" stop-color="hsl(313 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(313 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lparallellabs3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
