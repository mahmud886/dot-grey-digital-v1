    <filter id="blparallellabs3"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="grparallellabs3"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bparallellabs3)"/>
  <rect width="1600" height="1000" fill="url(#g1parallellabs3)"/>
  <rect width="1600" height="1000" fill="url(#g2parallellabs3)"/>

  <g filter="url(#blparallellabs3)" opacity="0.85">
