<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Parallel Labs — image 3">
  <defs>
    <linearGradient id="bparallellabs3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(13 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(33 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(58 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1parallellabs3" cx="38%" cy="0%" r="58%">
