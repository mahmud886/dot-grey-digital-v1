<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Northline Logistics — image 2">
  <defs>
    <linearGradient id="bnorthlinelogistics2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(11 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(31 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(56 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1northlinelogistics2" cx="16%" cy="25%" r="58%">
      <stop offset="0%" stop-color="hsl(21 70% 55%)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="hsl(21 70% 55%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2northlinelogistics2" cx="51%" cy="55%" r="48%">
      <stop offset="0%" stop-color="hsl(311 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(311 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lnorthlinelogistics2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blnorthlinelogistics2"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="grnorthlinelogistics2"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bnorthlinelogistics2)"/>
  <rect width="1600" height="1000" fill="url(#g1northlinelogistics2)"/>
  <rect width="1600" height="1000" fill="url(#g2northlinelogistics2)"/>

  <g filter="url(#blnorthlinelogistics2)" opacity="0.85">
    <rect x="-320" y="220" width="2240" height="90" fill="url(#lnorthlinelogistics2)" transform="rotate(11 800 500)"/>
    <rect x="-320" y="660" width="2240" height="50" fill="url(#lnorthlinelogistics2)" transform="rotate(11 800 500)"/>
  </g>

  

  <rect width="1600" height="1000" filter="url(#grnorthlinelogistics2)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <rect width="1600" height="1000" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>