<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Fintech Pro">
  <defs>
    <linearGradient id="bfintechpro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(332 16% 12%)"/>
      <stop offset="55%" stop-color="hsl(352 14% 8%)"/>
      <stop offset="100%" stop-color="hsl(17 18% 6%)"/>
    </linearGradient>
    <radialGradient id="g1fintechpro" cx="37%" cy="37%" r="58%">
      <stop offset="0%" stop-color="hsl(342 70% 55%)" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="hsl(342 70% 55%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2fintechpro" cx="70%" cy="62%" r="48%">
      <stop offset="0%" stop-color="hsl(272 55% 45%)" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="hsl(272 55% 45%)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lfintechpro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blfintechpro"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="grfintechpro"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bfintechpro)"/>
  <rect width="1600" height="1000" fill="url(#g1fintechpro)"/>
  <rect width="1600" height="1000" fill="url(#g2fintechpro)"/>

  <g filter="url(#blfintechpro)" opacity="0.85">
    <rect x="-320" y="220" width="2240" height="90" fill="url(#lfintechpro)" transform="rotate(-28 800 500)"/>
    <rect x="-320" y="660" width="2240" height="50" fill="url(#lfintechpro)" transform="rotate(-28 800 500)"/>
  </g>

  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-family="Kanit, system-ui, sans-serif" font-weight="700" font-size="320" fill="#ffffff" fill-opacity="0.08" letter-spacing="-0.03em">FP</text>

  <rect width="1600" height="1000" filter="url(#grfintechpro)" opacity="0.05" style="mix-blend-mode:overlay"/>
  <rect width="1600" height="1000" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
</svg>